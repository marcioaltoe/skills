name: CI | Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-skills:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: List discoverable skills
        run: |
          OUTPUT=$(npx --yes skills add . --list 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qi "no skills"; then
            echo "::error::No skills discovered. Check frontmatters in skills/."
            exit 1
          fi

      - name: Check setup presets
        run: node scripts/check-setups.mjs

      - name: Check registry consistency
        run: node scripts/check-registry.mjs

      # Scoped to repo-owned files; skills/** is vendored upstream content with
      # no formatting guarantee.
      - name: Check formatting
        run: npx --yes oxfmt@latest --check AGENTS.md README.md skills-registry.json skills-registry.lock.json scripts setups web/scripts web/src
