name: CI | Conventions

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-conventions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-conventions:
    name: Validate PR title and branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Cocogitto
        uses: cocogitto/cocogitto-action@v4
        with:
          command: --version

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: cog verify "$PR_TITLE"

      # Passed through env, never interpolated into the shell: a branch name is
      # attacker-controlled on a forked pull request.
      - name: Validate branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: node scripts/check-branch-name.mjs "$BRANCH"
