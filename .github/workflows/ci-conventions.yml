name: CI | Conventions

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-conventions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-conventions:
    name: Validate PR title and branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Cocogitto
        uses: cocogitto/cocogitto-action@390bda87a19bf627e03ad075c67a11e9ddbb7547
        with:
          command: --version

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: cog verify "$PR_TITLE"

      # Passed through env, never interpolated into the shell: a branch name is
      # attacker-controlled on a forked pull request.
      - name: Validate branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: node scripts/check-branch-name.mjs "$BRANCH"
